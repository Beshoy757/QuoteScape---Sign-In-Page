
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraForm AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Telegraf', 'Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', "Noto Sans", 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        /* Loading Telegraf with fallbacks */
        @font-face {
            font-family: 'Telegraf';
            src: local('Telegraf'), local('PP Telegraf'), 
                 url('https://fonts.cdnfonts.com/s/76121/Telegraf-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Telegraf';
            src: local('Telegraf Light'), local('PP Telegraf Light'), 
                 url('https://fonts.cdnfonts.com/s/76121/Telegraf-UltraLight.woff') format('woff');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Telegraf';
            src: local('Telegraf Bold'), local('PP Telegraf Bold'), 
                 url('https://fonts.cdnfonts.com/s/76121/Telegraf-UltraBold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        /* Global application to ensure inheritance and override any browser defaults */
        html, body, #root {
            height: 100%;
        }

        body, button, input, textarea, select, span, p, h1, h2, h3, h4, h5, h6 { 
            font-family: 'Telegraf', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif !important; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Aggressive selector for everything to ensure Telegraf is the source of truth */
        * {
            font-family: 'Telegraf', 'Inter', ui-sans-serif, system-ui, sans-serif;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
</body>
</html>
